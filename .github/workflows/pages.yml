name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Never publish a commit whose CI failed, nor a workflow run from another branch.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # Build an inspectable Pages artifact even before the repository owner
      # enables GitHub Pages in Settings > Pages > Source: GitHub Actions.
      - name: Prepare static PWA
        env:
          DEPLOY_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ ! "$DEPLOY_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid deployment commit."
            exit 1
          fi
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest icon.svg sw.js _site/
          cp -R src data _site/
          printf '{"commit":"%s"}\n' "$DEPLOY_COMMIT" > _site/deployment.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check one-time Pages setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --location \
            --output /tmp/pages-site.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "${code}" = "404" ]; then
            echo "::error title=GitHub Pages non activé::Ouvrir Settings > Pages > Build and deployment > Source et choisir GitHub Actions. Puis relancer ce workflow sur main. Aucun jeton personnel nécessaire."
            exit 1
          fi
          if [ "${code}" != "200" ]; then
            echo "::error title=Accès GitHub Pages impossible::API GitHub Pages HTTP ${code}. Vérifier les permissions du dépôt et du jeton Actions."
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public HTTPS release and required PWA assets
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/check-public-pages.mjs
      - name: Record publicly verified release
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "### Promo Alimentaire — release verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $EXPECTED_DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTPS HTML, JavaScript, CSS, PWA manifest, service worker, data manifest: verified" >> "$GITHUB_STEP_SUMMARY"

  android-live:
    name: Android Chrome journey on published Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Pixel 7 smoke against live GitHub Pages
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$SMOKE_URL"
          node scripts/mobile-smoke.mjs
      - name: Upload live Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-live-pages-${{ github.run_id }}
          path: artifacts/mobile/
          if-no-files-found: ignore
