name: Deploy PWA to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Never publish a commit whose CI failed, nor a workflow run from another branch.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # Build an inspectable Pages artifact even before the repository owner
      # enables GitHub Pages in Settings > Pages > Source: GitHub Actions.
      - name: Prepare static PWA
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest icon.svg sw.js _site/
          cp -R src data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check one-time Pages setup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl --silent --show-error --location \
            --output /tmp/pages-site.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "${code}" = "404" ]; then
            echo "::error title=GitHub Pages non activé::Ouvrir Settings > Pages > Build and deployment > Source et choisir GitHub Actions. Puis relancer ce workflow sur main. Aucun jeton personnel nécessaire."
            exit 1
          fi
          if [ "${code}" != "200" ]; then
            echo "::error title=Accès GitHub Pages impossible::API GitHub Pages HTTP ${code}. Vérifier les permissions du dépôt et du jeton Actions."
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
