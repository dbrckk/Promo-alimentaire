name: Verify E.Leclerc catalogue

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-leclerc-catalog.mjs"
      - "src/adapters/leclerc-catalog.js"
      - "data/import/leclerc-catalog-2026-10-07.json"
      - ".github/workflows/sync-leclerc-catalog.yml"

permissions:
  contents: write

concurrency:
  group: leclerc-catalog-sync
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public catalogue evidence
        run: npm run sync:leclerc -- --write
      - name: Validate repository
        run: npm run verify
      - name: Commit refreshed verification dates
        shell: bash
        run: |
          if git diff --quiet -- data/import/leclerc-catalog-2026-10-07.json; then
            echo "No verified catalogue change to commit."
            exit 0
          fi
          git config user.name "promo-alimentaire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import/leclerc-catalog-2026-10-07.json
          git commit -m "data: reverify E.Leclerc catalogue offers"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          exit 1
