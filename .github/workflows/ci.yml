name: CI
on:
  push:
  pull_request:
  # GitHub Actions pushes made with GITHUB_TOKEN do not trigger push CI.
  # A daily validation also republishes successfully refreshed catalog data.
  schedule:
    - cron: "33 8 * * *"
  # Commits made by GITHUB_TOKEN in source workflows do not emit normal
  # push CI. workflow_run is allowed to start a fresh CI on updated main,
  # which then triggers the existing verified Pages/Android deployment.
  workflow_run:
    workflows:
      - "Sync Shopmium"
      - "Sync Coupon Network"
      - "Sync La Belle Adresse"
      - "Sync payment discounts"
      - "Verify Carrefour promotions"
      - "Verify E.Leclerc catalogue"
    types: [completed]
permissions:
  contents: read

# A newer push supersedes the older source tree on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A sync run with no new commit should not redeploy an unchanged site.
    # For workflow_run GitHub provides github.sha as the latest default
    # branch commit; head_sha is the source workflow's original checkout.
    # Ignore failed/foreign workflows; never trust arbitrary branch code.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.sha != github.event.workflow_run.head_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
