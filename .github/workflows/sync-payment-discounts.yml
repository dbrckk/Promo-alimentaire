name: Sync payment discounts

on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync-payment-discounts.mjs"
      - "src/adapters/payment-discounts.js"
      - ".github/workflows/sync-payment-discounts.yml"

permissions:
  contents: write

concurrency:
  group: payment-discounts-sync
  cancel-in-progress: true

env:
  PAYMENT_RATE_GUARD_VERSION: "2"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current public payment rates
        run: npm run sync:payments -- --write
      - name: Validate generated data
        run: npm run verify
      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/import/payment-discounts-auto.json data/import/index.json; then
            echo "No payment-rate change to commit."
            exit 0
          fi
          git config user.name "promo-alimentaire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import/payment-discounts-auto.json data/import/index.json
          git commit -m "data: refresh public payment discounts"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          exit 1
