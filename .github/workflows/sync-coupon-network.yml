name: Sync Coupon Network

on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coupon-network-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and build conservative snapshot
        run: npm run sync:coupon-network -- --write
      - name: Validate generated data
        run: npm run verify
      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/import/coupon-network-auto.json data/import/index.json; then
            echo "No snapshot change to commit."
            exit 0
          fi
          git config user.name "promo-alimentaire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import/coupon-network-auto.json data/import/index.json
          git commit -m "data: refresh Coupon Network public offers"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying after refresh."
            sleep $((attempt * 2))
          done
          echo "Unable to push refreshed snapshot after 3 attempts."
          exit 1
