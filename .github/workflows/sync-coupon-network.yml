name: Sync Coupon Network

on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-coupon-network.mjs"
      - "src/adapters/coupon-network.js"
      - "tests/coupon-network.test.js"
      - ".github/workflows/sync-coupon-network.yml"

permissions:
  contents: write

concurrency:
  group: coupon-network-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install open-source browser for public catalogue rendering
        run: |
          bash scripts/setup-playwright-chromium.sh
      - name: Fetch and build conservative snapshot
        run: npm run sync:coupon-network -- --write
      - name: Validate generated data
        run: npm run verify
      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/import/coupon-network-auto.json data/import/index.json data/import/source-sync-status.json; then
            echo "No snapshot change to commit."
            exit 0
          fi
          git config user.name "promo-alimentaire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import/coupon-network-auto.json data/import/index.json data/import/source-sync-status.json
          git commit -m "data: record Coupon Network refresh outcome"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt $attempt failed; retrying after refresh."
            sleep $((attempt * 2))
          done
          echo "Unable to push refreshed snapshot after 3 attempts."
          exit 1
