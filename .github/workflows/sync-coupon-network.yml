name: Sync Coupon Network

on:
  schedule:
    - cron: "23 5 * * 1,4"
  workflow_dispatch:
  push:
    paths:
      - "src/adapters/coupon-network.js"
      - "scripts/sync-coupon-network.mjs"
      - ".github/workflows/sync-coupon-network.yml"

permissions:
  contents: write

concurrency:
  group: coupon-network-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and build conservative snapshot
        run: npm run sync:coupon-network -- --write
      - name: Validate generated data
        run: npm run verify
      - name: Commit snapshot when changed
        shell: bash
        run: |
          if git diff --quiet -- data/import/coupon-network-auto.json data/import/index.json; then
            echo "No snapshot change to commit."
            exit 0
          fi
          git config user.name "promo-alimentaire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import/coupon-network-auto.json data/import/index.json
          git commit -m "data: refresh Coupon Network public offers"
          git push
