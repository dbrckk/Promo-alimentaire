name: Offer freshness

on:
  schedule:
    # Run after scheduled retailer, coupon and payment syncs (05:xx-06:xx UTC).
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate imports
        run: npm run validate:imports
      - name: Check freshness
        run: npm run check:freshness -- --strict
